AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Netra — GitHub webhook receiver.

  The minimal production entry point: an HTTPS endpoint that accepts GitHub
  deliveries, verifies their signature against a secret held in Secrets Manager,
  and acknowledges quickly. The investigation workflow is wired behind this in a
  later stack; nothing here depends on it.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment stage; used to name resources.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention. Kept short to bound cost.

  # Roles the deploying principal cannot create (PowerUserAccess cannot call
  # iam:CreateRole), so they are created out of band and passed in.
  LambdaRoleArn:
    Type: String
    Default: ''
    Description: Execution role for the investigation lifecycle Lambdas.

  StateMachineRoleArn:
    Type: String
    Default: ''
    Description: Execution role for the investigation state machine.

  TaskExecutionRoleArn:
    Type: String
    Default: ''
    Description: ECS agent role, used to pull the image and write logs.

  TaskRoleArn:
    Type: String
    Default: ''
    Description: Role assumed by the investigator container itself.

  EventsRoleArn:
    Type: String
    Default: ''
    Description: Role EventBridge assumes to start a state machine execution.

  DeployPublicSurface:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether this stack also owns the public read API (Lambda Function URL) and
      the web bucket + CloudFront distribution. Both currently exist outside the
      stack, so adopting them is a deliberate, separate step: CloudFormation
      refuses to create an S3 bucket whose name is already taken, which blocks
      every unrelated deployment until the switch is thrown on purpose.

  CognitoUserPoolId:
    Type: String
    Default: ''
    Description: >-
      Cognito user pool that issues the tokens the approval endpoint trusts
      (e.g. eu-north-1_xxxxxxxxx). Public identifier, not a secret. Approval is
      a privileged action, so the endpoint refuses to deploy open: with no pool
      configured the DeployApproval condition leaves it unbuilt.

  CognitoClientId:
    Type: String
    Default: ''
    Description: >-
      Cognito app client id the approval endpoint accepts as the token audience.
      Public identifier, not a secret.

  ModelSecretPopulated:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether netra/<stage>/model/openrouter holds a value. A model is optional:
      with none, investigations run deterministic-only and say so. The ECS agent
      cannot resolve a secret that has no value, so the task only references it
      once it has been populated.

  InvestigatorImageUri:
    Type: String
    Default: ''
    Description: ECR image URI for the investigator task.

  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Public subnets the investigation task runs in.

  VpcId:
    Type: String
    Default: ''
    Description: VPC containing those subnets.

  ExecutionRoleArn:
    Type: String
    Default: ''
    # Empty, or a role ARN. Empty means "create the role in this stack".
    AllowedPattern: '^$|^arn:(aws[a-zA-Z-]*)?:iam::\d{12}:role/[a-zA-Z_0-9+=,.@\-_/]+$'
    ConstraintDescription: Must be empty or a valid IAM role ARN.
    Description: >-
      Optional pre-created Lambda execution role. Supply this when the deploying
      principal cannot create IAM roles (an AWS PowerUserAccess profile cannot).
      Leave empty to let the stack create a least-privilege role itself.

Conditions:
  # Whether the deployer supplied a role, or the stack must create one.
  UseSuppliedRole: !Not [!Equals [!Ref ExecutionRoleArn, '']]
  # The investigation workflow only deploys once its roles and image exist, so
  # the webhook stack stays deployable on its own.
  HasModelSecret: !Equals [!Ref ModelSecretPopulated, 'true']
  DeployWorkflow: !And
    - !Not [!Equals [!Ref LambdaRoleArn, '']]
    - !Not [!Equals [!Ref StateMachineRoleArn, '']]
    - !Not [!Equals [!Ref InvestigatorImageUri, '']]
  # The approval endpoint launches a task that writes to a customer repository.
  # It deploys only when an identity provider is configured to authenticate it,
  # so an unauthenticated approval endpoint cannot exist by omission.
  DeployPublic: !Equals [!Ref DeployPublicSurface, 'true']
  DeployApproval: !And
    - !Condition DeployWorkflow
    - !Not [!Equals [!Ref CognitoUserPoolId, '']]
    - !Not [!Equals [!Ref CognitoClientId, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]      # Graviton: cheaper per millisecond than x86.
    MemorySize: 256
    # GitHub gives a delivery 10 seconds. Failing well inside that means a slow
    # dependency surfaces as our error rather than as a GitHub timeout.
    Timeout: 8
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        NETRA_STAGE: !Ref Stage

Resources:
  # --------------------------------------------------------------------------
  # Secrets
  # --------------------------------------------------------------------------

  # The webhook secret is GENERATED by AWS rather than supplied. It therefore
  # never exists in source, in this template, or in a shell history: the value
  # is read from Secrets Manager and pasted into the GitHub App form once.
  GitHubWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'netra/${Stage}/github/webhook'
      Description: >-
        HMAC secret shared with the Netra GitHub App. Copy this value into the
        App's "Webhook secret" field.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: webhookSecret
        PasswordLength: 40
        # Keep it alphanumeric: GitHub's form and shell tooling both handle it
        # without escaping surprises.
        ExcludePunctuation: true

  # The GitHub App's identity: the App ID and its RSA private key, used to mint
  # short-lived installation tokens.
  #
  # Deliberately a SEPARATE secret from the webhook secret. The webhook receiver
  # needs only the HMAC secret, and giving it the private key as well would let
  # a flaw in a public, unauthenticated endpoint reach the credential that can
  # act on a customer's repositories.
  #
  # This resource carries NO value. CloudFormation owns the name, the ARN and
  # the IAM references; the private key is injected out of band with
  # `put-secret-value`, so it never enters this template, this repository, or a
  # CloudFormation change set.
  GitHubAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'netra/${Stage}/github/app'
      Description: >-
        Netra GitHub App credentials as JSON: {"appId","appSlug","privateKey"}.
        The value is set out of band and is never stored in source control.

  # --------------------------------------------------------------------------
  # Delivery idempotency and eventing
  # --------------------------------------------------------------------------

  # GitHub retries a delivery it considers failed, and a retry carries the same
  # X-GitHub-Delivery id. This table is how "we have already handled this one"
  # is decided: the first conditional write wins, so two concurrent invocations
  # cannot both proceed.
  DeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'netra-${Stage}-deliveries'
      BillingMode: PAY_PER_REQUEST     # Webhook traffic is bursty and sparse.
      AttributeDefinitions:
        - AttributeName: deliveryId
          AttributeType: S
      KeySchema:
        - AttributeName: deliveryId
          KeyType: HASH
      TimeToLiveSpecification:
        # Claims are only useful while GitHub might still retry; a week is far
        # beyond that, and TTL keeps the table from growing without bound.
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        # Idempotency claims are reconstructible and short-lived; paying to
        # back them up would buy nothing.
        PointInTimeRecoveryEnabled: false

  # Decouples "GitHub said something changed" from "Netra investigates it", so
  # the investigation can be slow, retried or replaced without GitHub waiting.
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'netra-${Stage}'

  # Until the investigation workflow exists, published events would vanish with
  # no trace. This archive keeps them, so the first workflow can be tested
  # against real deliveries rather than invented ones.
  EventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub 'netra-${Stage}-changes'
      SourceArn: !GetAtt EventBus.Arn
      Description: Code change events, retained so a new consumer can replay them.
      RetentionDays: 7
      EventPattern:
        source:
          - netra.github

  # --------------------------------------------------------------------------
  # Webhook receiver
  # --------------------------------------------------------------------------

  GitHubWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'netra-${Stage}-github-webhook'
      # Pre-bundled by `pnpm --filter @netra/webhook build`.
      CodeUri: ../services/webhook/dist
      Handler: githubWebhook.handler
      Description: Verifies and acknowledges GitHub webhook deliveries.
      Environment:
        Variables:
          GITHUB_WEBHOOK_SECRET_ARN: !Ref GitHubWebhookSecret
          NETRA_DELIVERIES_TABLE: !Ref DeliveriesTable
          NETRA_EVENT_BUS_NAME: !Ref EventBus
      # A supplied role is used as-is; its permissions are the deployer's to
      # manage. Otherwise the stack creates a role that can read exactly one
      # secret and nothing else.
      Role: !If [UseSuppliedRole, !Ref ExecutionRoleArn, !Ref 'AWS::NoValue']
      # Ignored by SAM when Role is supplied; applied to the generated role
      # otherwise. Least privilege either way: one secret, nothing else.
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubWebhookSecret
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /github/webhook
            Method: POST

  GitHubWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/netra-${Stage}-github-webhook'
      RetentionInDays: !Ref LogRetentionDays

  # --------------------------------------------------------------------------
  # API
  # --------------------------------------------------------------------------

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: Netra public webhook endpoint.
      # No CORS: this endpoint is called by GitHub's servers, never a browser.
      AccessLogSettings:
        DestinationArn: !GetAtt WebhookApiLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod","path":"$context.path",
          "status":"$context.status","latency":"$context.responseLatency",
          "integrationStatus":"$context.integrationStatus"}

  WebhookApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/netra-${Stage}-webhook'
      RetentionInDays: !Ref LogRetentionDays


  # --------------------------------------------------------------------------
  # Investigation workflow
  # --------------------------------------------------------------------------

  # One partition per investigation, so the record, its lifecycle events,
  # findings, evidence, verification results and blast radius are a single
  # query rather than six.
  InvestigationsTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployWorkflow
    Properties:
      TableName: !Sub 'netra-${Stage}-investigations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  InvestigatorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployWorkflow
    Properties:
      LogGroupName: !Sub '/aws/ecs/netra-${Stage}-investigator'
      RetentionInDays: !Ref LogRetentionDays

  InvestigationCluster:
    Type: AWS::ECS::Cluster
    Condition: DeployWorkflow
    Properties:
      ClusterName: !Sub 'netra-${Stage}'
      ClusterSettings:
        - Name: containerInsights
          Value: disabled      # Per-task metrics are not worth the cost here.

  # Egress only: the task must reach GitHub and the model gateway, and nothing
  # needs to reach the task.
  InvestigatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DeployWorkflow
    Properties:
      GroupDescription: Netra investigation task; outbound only.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to GitHub and the model gateway.
      Tags:
        - Key: Name
          Value: !Sub 'netra-${Stage}-investigator'

  InvestigatorTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: DeployWorkflow
    Properties:
      Family: !Sub 'netra-${Stage}-investigator'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: investigator
          Image: !Ref InvestigatorImageUri
          Essential: true
          ReadonlyRootFilesystem: false   # The workspace is written under /tmp.
          Environment:
            - Name: NETRA_TABLE_NAME
              Value: !Sub 'netra-${Stage}-investigations'
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
          # Resolved by the ECS agent at start time, so no secret value appears
          # in the task definition or in an API response that describes it.
          #
          # The model secret is referenced only once it holds a value: ECS
          # fails a task that cannot resolve a secret, and refusing to start
          # over an optional dependency would turn "no model configured" into
          # "no investigation at all".
          Secrets: !If
            - HasModelSecret
            - - Name: NETRA_GITHUB_APP_SECRET
                ValueFrom: !Ref GitHubAppSecret
              - Name: OPENROUTER_API_KEYS
                ValueFrom: !Ref ModelProviderSecret
            - - Name: NETRA_GITHUB_APP_SECRET
                ValueFrom: !Ref GitHubAppSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref InvestigatorLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: task

  # Declared with no value; populated out of band like the GitHub App secret.
  ModelProviderSecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeployWorkflow
    Properties:
      Name: !Sub 'netra/${Stage}/model/openrouter'
      Description: >-
        Comma-separated OpenRouter API keys used as a reliability failover pool.
        Set out of band; never stored in source control.

  CreateInvestigationFunction:
    Type: AWS::Serverless::Function
    Condition: DeployWorkflow
    Properties:
      FunctionName: !Sub 'netra-${Stage}-create-investigation'
      CodeUri: ../services/orchestrator/dist
      Handler: createInvestigation.handler
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          NETRA_TABLE_NAME: !Ref InvestigationsTable

  ConfirmOutcomeFunction:
    Type: AWS::Serverless::Function
    Condition: DeployWorkflow
    Properties:
      FunctionName: !Sub 'netra-${Stage}-confirm-outcome'
      CodeUri: ../services/orchestrator/dist
      Handler: confirmOutcome.handler
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          NETRA_TABLE_NAME: !Ref InvestigationsTable

  RecordFailureFunction:
    Type: AWS::Serverless::Function
    Condition: DeployWorkflow
    Properties:
      FunctionName: !Sub 'netra-${Stage}-record-failure'
      CodeUri: ../services/orchestrator/dist
      Handler: recordFailure.handler
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          NETRA_TABLE_NAME: !Ref InvestigationsTable

  # --------------------------------------------------------------------------
  # Approval endpoint
  # --------------------------------------------------------------------------
  # A single Lambda that validates the AWAITING_APPROVAL state, records the
  # approval in DynamoDB, and launches a Fargate remediation task. The Fargate
  # task already has NETRA_GITHUB_APP_SECRET injected by the ECS agent from
  # Secrets Manager — this Lambda never reads or logs any secret value.

  ApproveInvestigationFunction:
    Type: AWS::Serverless::Function
    Condition: DeployApproval
    Properties:
      FunctionName: !Sub 'netra-${Stage}-approve-investigation'
      CodeUri: ../services/orchestrator/dist
      Handler: approveInvestigation.handler
      Role: !Ref LambdaRoleArn
      Timeout: 30
      Environment:
        Variables:
          NETRA_TABLE_NAME: !Ref InvestigationsTable
          NETRA_CLUSTER_ARN: !GetAtt InvestigationCluster.Arn
          NETRA_TASK_DEFINITION_ARN: !Ref InvestigatorTaskDefinition
          NETRA_SUBNET_IDS: !Join [',', !Ref VpcSubnetIds]
          NETRA_SECURITY_GROUP_ID: !GetAtt InvestigatorSecurityGroup.GroupId
          NETRA_TASK_ROLE_ARN: !Ref TaskRoleArn
          NETRA_TASK_EXECUTION_ROLE_ARN: !Ref TaskExecutionRoleArn
      Events:
        Approve:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApprovalApi
            Path: /investigations/{id}/approve
            Method: POST

  ApprovalApi:
    Type: AWS::Serverless::HttpApi
    Condition: DeployApproval
    Properties:
      StageName: !Ref Stage
      Description: Netra human approval endpoint for investigation remediations.
      # Approving launches a Fargate task that pushes a commit to the customer's
      # repository. API Gateway verifies the Cognito JWT (signature, issuer,
      # audience, expiry) before the Lambda ever runs; the Lambda then does its
      # own per-investigation ownership check on the verified claims.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}'
              audience:
                - !Ref CognitoClientId
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  ApproveInvestigationLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployApproval
    Properties:
      LogGroupName: !Sub '/aws/lambda/netra-${Stage}-approve-investigation'
      RetentionInDays: !Ref LogRetentionDays

  InvestigationStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployWorkflow
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/netra-${Stage}-investigation'
      RetentionInDays: !Ref LogRetentionDays

  InvestigationStateMachine:
    Type: AWS::Serverless::StateMachine
    Condition: DeployWorkflow
    Properties:
      Name: !Sub 'netra-${Stage}-investigation'
      Type: STANDARD
      Role: !Ref StateMachineRoleArn
      DefinitionUri: step-functions/investigation.asl.json
      DefinitionSubstitutions:
        CreateInvestigationFunctionArn: !GetAtt CreateInvestigationFunction.Arn
        ConfirmOutcomeFunctionArn: !GetAtt ConfirmOutcomeFunction.Arn
        RecordFailureFunctionArn: !GetAtt RecordFailureFunction.Arn
        ClusterArn: !GetAtt InvestigationCluster.Arn
        TaskDefinitionArn: !Ref InvestigatorTaskDefinition
        SecurityGroupId: !GetAtt InvestigatorSecurityGroup.GroupId
        # Three separate substitutions rather than one JSON array, so the
        # definition file stays valid JSON with the placeholders still in it --
        # CloudFormation parses it before substituting.
        SubnetOne: !Select [0, !Ref VpcSubnetIds]
        SubnetTwo: !Select [1, !Ref VpcSubnetIds]
        SubnetThree: !Select [2, !Ref VpcSubnetIds]
      Logging:
        Level: ALL
        IncludeExecutionData: false   # Execution data can carry change detail.
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt InvestigationStateMachineLogGroup.Arn
      Tracing:
        Enabled: true

  # The link between the webhook and the workflow.
  CodeChangeRule:
    Type: AWS::Events::Rule
    Condition: DeployWorkflow
    Properties:
      Name: !Sub 'netra-${Stage}-code-change'
      Description: Starts an investigation when a code change is published.
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - netra.github
        detail-type:
          - Netra.CodeChange
      State: ENABLED
      Targets:
        - Id: investigation-state-machine
          Arn: !Ref InvestigationStateMachine
          RoleArn: !Ref EventsRoleArn
          # A change that cannot be delivered to the workflow is kept rather
          # than dropped, so nothing is lost while the workflow is unhealthy.
          DeadLetterConfig:
            Arn: !GetAtt CodeChangeDeadLetterQueue.Arn
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 3600

  CodeChangeDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: DeployWorkflow
    Properties:
      QueueName: !Sub 'netra-${Stage}-code-change-dlq'
      MessageRetentionPeriod: 1209600   # 14 days
      SqsManagedSseEnabled: true

  CodeChangeDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: DeployWorkflow
    Properties:
      Queues: [!Ref CodeChangeDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CodeChangeDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CodeChangeRule.Arn

  # --------------------------------------------------------------------------
  # Observability
  # --------------------------------------------------------------------------

  # A rejected signature is normal once; a sustained run of them means either a
  # misconfigured App or someone probing the endpoint.
  WebhookErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'netra-${Stage}-webhook-errors'
      AlarmDescription: The webhook receiver is failing to process deliveries.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GitHubWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ── Investigation API (public, read-only, demo-safe) ─────────────────────

  NetraApiFunction:
    Type: AWS::Serverless::Function
    Condition: DeployPublic
    Properties:
      FunctionName: !Sub 'netra-${Stage}-api'
      Description: >-
        Netra Investigation API. Wraps the Fastify HTTP server in a Lambda
        Function URL so the frontend can query investigations from DynamoDB
        without exposing AWS credentials to the browser.
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      CodeUri: ../services/api/dist-lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          NODE_ENV: production
          # Read investigations from the production DynamoDB table.
          NETRA_TABLE_NAME: !Sub 'netra-${Stage}-investigations'
          # Allow the CloudFront origin and any localhost dev URL.
          # The exact CloudFront domain is not known at deploy time, so we
          # allow all origins for the demo deployment.
          NETRA_ALLOWED_ORIGINS: '*'
          # Enable demo mode so unauthenticated guests can browse investigations.
          VITE_DEMO_MODE_ENABLED: 'true'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/netra-${Stage}-investigations'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/netra-${Stage}-investigations/*'

  NetraApiFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: DeployPublic
    Properties:
      TargetFunctionArn: !GetAtt NetraApiFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - authorization
          - content-type
          - x-amz-date
          - x-amz-security-token
        # Preflight is handled by the Function URL itself; OPTIONS is not a
        # valid entry here and CloudFormation rejects it.
        AllowMethods:
          - GET
          - POST
        MaxAge: 300

  NetraApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: DeployPublic
    Properties:
      FunctionName: !GetAtt NetraApiFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # ── Frontend static hosting (S3 + CloudFront) ────────────────────────────

  WebBucket:
    Type: AWS::S3::Bucket
    Condition: DeployPublic
    Properties:
      BucketName: !Sub 'netra-${Stage}-web-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled

  WebBucketOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: DeployPublic
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'netra-${Stage}-web-oac'
        Description: Grants CloudFront read access to the web bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: DeployPublic
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: DeployPublic
    Properties:
      DistributionConfig:
        Comment: !Sub 'Netra ${Stage} web application'
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100  # US/EU only — cheapest for demos
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt WebBucketOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
        # Route all 403/404s back to index.html so the React SPA handles them.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  WebhookUrl:
    Description: Paste this into the GitHub App's "Webhook URL" field.
    Value: !Sub 'https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/github/webhook'
    Export:
      Name: !Sub 'netra-${Stage}-webhook-url'

  WebhookFunctionName:
    Description: Lambda function handling deliveries.
    Value: !Ref GitHubWebhookFunction

  WebhookSecretArn:
    Description: >-
      Secrets Manager secret holding the webhook secret. Read the value with
      `aws secretsmanager get-secret-value` and paste it into the GitHub App.
    Value: !Ref GitHubWebhookSecret

  WebhookSecretName:
    Description: Secret name, for convenience.
    Value: !Sub 'netra/${Stage}/github/webhook'

  GitHubAppSecretArn:
    Description: >-
      Secrets Manager secret holding the GitHub App ID and private key. Created
      empty; populate it with `aws secretsmanager put-secret-value`.
    Value: !Ref GitHubAppSecret

  GitHubAppSecretName:
    Description: GitHub App credentials secret name.
    Value: !Sub 'netra/${Stage}/github/app'

  DeliveriesTableName:
    Description: DynamoDB table holding delivery idempotency claims.
    Value: !Ref DeliveriesTable

  DeliveriesTableArn:
    Description: Needed when granting the webhook role write access.
    Value: !GetAtt DeliveriesTable.Arn

  EventBusName:
    Description: EventBridge bus carrying Netra.CodeChange events.
    Value: !Ref EventBus

  EventBusArn:
    Description: Needed when granting the webhook role events:PutEvents.
    Value: !GetAtt EventBus.Arn

  InvestigationStateMachineArn:
    Condition: DeployWorkflow
    Description: The investigation workflow.
    Value: !Ref InvestigationStateMachine

  InvestigationsTableName:
    Condition: DeployWorkflow
    Description: DynamoDB table holding investigations and their results.
    Value: !Ref InvestigationsTable

  ModelProviderSecretName:
    Condition: DeployWorkflow
    Description: Secret holding the OpenRouter keys; populate it out of band.
    Value: !Sub 'netra/${Stage}/model/openrouter'

  ApprovalApiUrl:
    Condition: DeployApproval
    Description: >-
      Approval endpoint. POST /investigations/{id}/approve with {actionId} in
      the JSON body and a Cognito bearer token in the Authorization header to
      approve an AWAITING_APPROVAL investigation.
    Value: !Sub 'https://${ApprovalApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  ApproveInvestigationFunctionName:
    Condition: DeployApproval
    Description: Lambda function name for the approval handler.
    Value: !Ref ApproveInvestigationFunction

  # ── Public-facing API and Web ───────────────────────────────────────────────

  ApiUrl:
    Condition: DeployPublic
    Description: >-
      Public URL of the Netra Investigation API (Lambda Function URL).
      Set VITE_API_BASE_URL to this value when building the frontend.
    Value: !GetAtt NetraApiFunctionUrl.FunctionUrl

  WebUrl:
    Condition: DeployPublic
    Description: >-
      Public HTTPS URL of the Netra web application (CloudFront distribution).
      Share this link for demos.
    Value: !Sub 'https://${WebDistribution.DomainName}'

  WebBucketName:
    Condition: DeployPublic
    Description: S3 bucket holding the compiled frontend assets.
    Value: !Ref WebBucket

