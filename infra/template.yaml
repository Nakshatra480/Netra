AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Netra — GitHub webhook receiver.

  The minimal production entry point: an HTTPS endpoint that accepts GitHub
  deliveries, verifies their signature against a secret held in Secrets Manager,
  and acknowledges quickly. The investigation workflow is wired behind this in a
  later stack; nothing here depends on it.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment stage; used to name resources.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention. Kept short to bound cost.

  # Roles the deploying principal cannot create (PowerUserAccess cannot call
  # iam:CreateRole), so they are created out of band and passed in.
  LambdaRoleArn:
    Type: String
    Default: ''
    Description: Execution role for the investigation lifecycle Lambdas.

  StateMachineRoleArn:
    Type: String
    Default: ''
    Description: Execution role for the investigation state machine.

  TaskExecutionRoleArn:
    Type: String
    Default: ''
    Description: ECS agent role, used to pull the image and write logs.

  TaskRoleArn:
    Type: String
    Default: ''
    Description: Role assumed by the investigator container itself.

  EventsRoleArn:
    Type: String
    Default: ''
    Description: Role EventBridge assumes to start a state machine execution.

  InvestigatorImageUri:
    Type: String
    Default: ''
    Description: ECR image URI for the investigator task.

  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Public subnets the investigation task runs in.

  VpcId:
    Type: String
    Default: ''
    Description: VPC containing those subnets.

  ExecutionRoleArn:
    Type: String
    Default: ''
    # Empty, or a role ARN. Empty means "create the role in this stack".
    AllowedPattern: '^$|^arn:(aws[a-zA-Z-]*)?:iam::\d{12}:role/[a-zA-Z_0-9+=,.@\-_/]+$'
    ConstraintDescription: Must be empty or a valid IAM role ARN.
    Description: >-
      Optional pre-created Lambda execution role. Supply this when the deploying
      principal cannot create IAM roles (an AWS PowerUserAccess profile cannot).
      Leave empty to let the stack create a least-privilege role itself.

Conditions:
  # Whether the deployer supplied a role, or the stack must create one.
  UseSuppliedRole: !Not [!Equals [!Ref ExecutionRoleArn, '']]
  # The investigation workflow only deploys once its roles and image exist, so
  # the webhook stack stays deployable on its own.
  DeployWorkflow: !And
    - !Not [!Equals [!Ref LambdaRoleArn, '']]
    - !Not [!Equals [!Ref StateMachineRoleArn, '']]
    - !Not [!Equals [!Ref InvestigatorImageUri, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]      # Graviton: cheaper per millisecond than x86.
    MemorySize: 256
    # GitHub gives a delivery 10 seconds. Failing well inside that means a slow
    # dependency surfaces as our error rather than as a GitHub timeout.
    Timeout: 8
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        NETRA_STAGE: !Ref Stage

Resources:
  # --------------------------------------------------------------------------
  # Secrets
  # --------------------------------------------------------------------------

  # The webhook secret is GENERATED by AWS rather than supplied. It therefore
  # never exists in source, in this template, or in a shell history: the value
  # is read from Secrets Manager and pasted into the GitHub App form once.
  GitHubWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'netra/${Stage}/github/webhook'
      Description: >-
        HMAC secret shared with the Netra GitHub App. Copy this value into the
        App's "Webhook secret" field.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: webhookSecret
        PasswordLength: 40
        # Keep it alphanumeric: GitHub's form and shell tooling both handle it
        # without escaping surprises.
        ExcludePunctuation: true

  # The GitHub App's identity: the App ID and its RSA private key, used to mint
  # short-lived installation tokens.
  #
  # Deliberately a SEPARATE secret from the webhook secret. The webhook receiver
  # needs only the HMAC secret, and giving it the private key as well would let
  # a flaw in a public, unauthenticated endpoint reach the credential that can
  # act on a customer's repositories.
  #
  # This resource carries NO value. CloudFormation owns the name, the ARN and
  # the IAM references; the private key is injected out of band with
  # `put-secret-value`, so it never enters this template, this repository, or a
  # CloudFormation change set.
  GitHubAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'netra/${Stage}/github/app'
      Description: >-
        Netra GitHub App credentials as JSON: {"appId","appSlug","privateKey"}.
        The value is set out of band and is never stored in source control.

  # --------------------------------------------------------------------------
  # Delivery idempotency and eventing
  # --------------------------------------------------------------------------

  # GitHub retries a delivery it considers failed, and a retry carries the same
  # X-GitHub-Delivery id. This table is how "we have already handled this one"
  # is decided: the first conditional write wins, so two concurrent invocations
  # cannot both proceed.
  DeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'netra-${Stage}-deliveries'
      BillingMode: PAY_PER_REQUEST     # Webhook traffic is bursty and sparse.
      AttributeDefinitions:
        - AttributeName: deliveryId
          AttributeType: S
      KeySchema:
        - AttributeName: deliveryId
          KeyType: HASH
      TimeToLiveSpecification:
        # Claims are only useful while GitHub might still retry; a week is far
        # beyond that, and TTL keeps the table from growing without bound.
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        # Idempotency claims are reconstructible and short-lived; paying to
        # back them up would buy nothing.
        PointInTimeRecoveryEnabled: false

  # Decouples "GitHub said something changed" from "Netra investigates it", so
  # the investigation can be slow, retried or replaced without GitHub waiting.
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'netra-${Stage}'

  # Until the investigation workflow exists, published events would vanish with
  # no trace. This archive keeps them, so the first workflow can be tested
  # against real deliveries rather than invented ones.
  EventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub 'netra-${Stage}-changes'
      SourceArn: !GetAtt EventBus.Arn
      Description: Code change events, retained so a new consumer can replay them.
      RetentionDays: 7
      EventPattern:
        source:
          - netra.github

  # --------------------------------------------------------------------------
  # Webhook receiver
  # --------------------------------------------------------------------------

  GitHubWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'netra-${Stage}-github-webhook'
      # Pre-bundled by `pnpm --filter @netra/webhook build`.
      CodeUri: ../services/webhook/dist
      Handler: githubWebhook.handler
      Description: Verifies and acknowledges GitHub webhook deliveries.
      Environment:
        Variables:
          GITHUB_WEBHOOK_SECRET_ARN: !Ref GitHubWebhookSecret
          NETRA_DELIVERIES_TABLE: !Ref DeliveriesTable
          NETRA_EVENT_BUS_NAME: !Ref EventBus
      # A supplied role is used as-is; its permissions are the deployer's to
      # manage. Otherwise the stack creates a role that can read exactly one
      # secret and nothing else.
      Role: !If [UseSuppliedRole, !Ref ExecutionRoleArn, !Ref 'AWS::NoValue']
      # Ignored by SAM when Role is supplied; applied to the generated role
      # otherwise. Least privilege either way: one secret, nothing else.
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubWebhookSecret
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /github/webhook
            Method: POST

  GitHubWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/netra-${Stage}-github-webhook'
      RetentionInDays: !Ref LogRetentionDays

  # --------------------------------------------------------------------------
  # API
  # --------------------------------------------------------------------------

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: Netra public webhook endpoint.
      # No CORS: this endpoint is called by GitHub's servers, never a browser.
      AccessLogSettings:
        DestinationArn: !GetAtt WebhookApiLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod","path":"$context.path",
          "status":"$context.status","latency":"$context.responseLatency",
          "integrationStatus":"$context.integrationStatus"}

  WebhookApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/netra-${Stage}-webhook'
      RetentionInDays: !Ref LogRetentionDays


  # --------------------------------------------------------------------------
  # Investigation workflow
  # --------------------------------------------------------------------------

  # One partition per investigation, so the record, its lifecycle events,
  # findings, evidence, verification results and blast radius are a single
  # query rather than six.
  InvestigationsTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployWorkflow
    Properties:
      TableName: !Sub 'netra-${Stage}-investigations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  InvestigatorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployWorkflow
    Properties:
      LogGroupName: !Sub '/aws/ecs/netra-${Stage}-investigator'
      RetentionInDays: !Ref LogRetentionDays

  InvestigationCluster:
    Type: AWS::ECS::Cluster
    Condition: DeployWorkflow
    Properties:
      ClusterName: !Sub 'netra-${Stage}'
      ClusterSettings:
        - Name: containerInsights
          Value: disabled      # Per-task metrics are not worth the cost here.

  # Egress only: the task must reach GitHub and the model gateway, and nothing
  # needs to reach the task.
  InvestigatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DeployWorkflow
    Properties:
      GroupDescription: Netra investigation task; outbound only.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to GitHub and the model gateway.
      Tags:
        - Key: Name
          Value: !Sub 'netra-${Stage}-investigator'

  InvestigatorTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: DeployWorkflow
    Properties:
      Family: !Sub 'netra-${Stage}-investigator'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: investigator
          Image: !Ref InvestigatorImageUri
          Essential: true
          ReadonlyRootFilesystem: false   # The workspace is written under /tmp.
          Environment:
            - Name: NETRA_TABLE_NAME
              Value: !Sub 'netra-${Stage}-investigations'
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
          # Resolved by the ECS agent at start time, so no secret value appears
          # in the task definition or in an API response that describes it.
          Secrets:
            - Name: NETRA_GITHUB_APP_SECRET
              ValueFrom: !Ref GitHubAppSecret
            - Name: OPENROUTER_API_KEYS
              ValueFrom: !Ref ModelProviderSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref InvestigatorLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: task

  # Declared with no value; populated out of band like the GitHub App secret.
  ModelProviderSecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeployWorkflow
    Properties:
      Name: !Sub 'netra/${Stage}/model/openrouter'
      Description: >-
        Comma-separated OpenRouter API keys used as a reliability failover pool.
        Set out of band; never stored in source control.

  CreateInvestigationFunction:
    Type: AWS::Serverless::Function
    Condition: DeployWorkflow
    Properties:
      FunctionName: !Sub 'netra-${Stage}-create-investigation'
      CodeUri: ../services/orchestrator/dist
      Handler: createInvestigation.handler
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          NETRA_TABLE_NAME: !Ref InvestigationsTable

  ConfirmOutcomeFunction:
    Type: AWS::Serverless::Function
    Condition: DeployWorkflow
    Properties:
      FunctionName: !Sub 'netra-${Stage}-confirm-outcome'
      CodeUri: ../services/orchestrator/dist
      Handler: confirmOutcome.handler
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          NETRA_TABLE_NAME: !Ref InvestigationsTable

  RecordFailureFunction:
    Type: AWS::Serverless::Function
    Condition: DeployWorkflow
    Properties:
      FunctionName: !Sub 'netra-${Stage}-record-failure'
      CodeUri: ../services/orchestrator/dist
      Handler: recordFailure.handler
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          NETRA_TABLE_NAME: !Ref InvestigationsTable

  InvestigationStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployWorkflow
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/netra-${Stage}-investigation'
      RetentionInDays: !Ref LogRetentionDays

  InvestigationStateMachine:
    Type: AWS::Serverless::StateMachine
    Condition: DeployWorkflow
    Properties:
      Name: !Sub 'netra-${Stage}-investigation'
      Type: STANDARD
      Role: !Ref StateMachineRoleArn
      DefinitionUri: step-functions/investigation.asl.json
      DefinitionSubstitutions:
        CreateInvestigationFunctionArn: !GetAtt CreateInvestigationFunction.Arn
        ConfirmOutcomeFunctionArn: !GetAtt ConfirmOutcomeFunction.Arn
        RecordFailureFunctionArn: !GetAtt RecordFailureFunction.Arn
        ClusterArn: !GetAtt InvestigationCluster.Arn
        TaskDefinitionArn: !Ref InvestigatorTaskDefinition
        SecurityGroupId: !GetAtt InvestigatorSecurityGroup.GroupId
        # Three separate substitutions rather than one JSON array, so the
        # definition file stays valid JSON with the placeholders still in it --
        # CloudFormation parses it before substituting.
        SubnetOne: !Select [0, !Ref VpcSubnetIds]
        SubnetTwo: !Select [1, !Ref VpcSubnetIds]
        SubnetThree: !Select [2, !Ref VpcSubnetIds]
      Logging:
        Level: ALL
        IncludeExecutionData: false   # Execution data can carry change detail.
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt InvestigationStateMachineLogGroup.Arn
      Tracing:
        Enabled: true

  # The link between the webhook and the workflow.
  CodeChangeRule:
    Type: AWS::Events::Rule
    Condition: DeployWorkflow
    Properties:
      Name: !Sub 'netra-${Stage}-code-change'
      Description: Starts an investigation when a code change is published.
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - netra.github
        detail-type:
          - Netra.CodeChange
      State: ENABLED
      Targets:
        - Id: investigation-state-machine
          Arn: !Ref InvestigationStateMachine
          RoleArn: !Ref EventsRoleArn
          # A change that cannot be delivered to the workflow is kept rather
          # than dropped, so nothing is lost while the workflow is unhealthy.
          DeadLetterConfig:
            Arn: !GetAtt CodeChangeDeadLetterQueue.Arn
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 3600

  CodeChangeDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: DeployWorkflow
    Properties:
      QueueName: !Sub 'netra-${Stage}-code-change-dlq'
      MessageRetentionPeriod: 1209600   # 14 days
      SqsManagedSseEnabled: true

  CodeChangeDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: DeployWorkflow
    Properties:
      Queues: [!Ref CodeChangeDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CodeChangeDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CodeChangeRule.Arn

  # --------------------------------------------------------------------------
  # Observability
  # --------------------------------------------------------------------------

  # A rejected signature is normal once; a sustained run of them means either a
  # misconfigured App or someone probing the endpoint.
  WebhookErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'netra-${Stage}-webhook-errors'
      AlarmDescription: The webhook receiver is failing to process deliveries.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GitHubWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  WebhookUrl:
    Description: Paste this into the GitHub App's "Webhook URL" field.
    Value: !Sub 'https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/github/webhook'
    Export:
      Name: !Sub 'netra-${Stage}-webhook-url'

  WebhookFunctionName:
    Description: Lambda function handling deliveries.
    Value: !Ref GitHubWebhookFunction

  WebhookSecretArn:
    Description: >-
      Secrets Manager secret holding the webhook secret. Read the value with
      `aws secretsmanager get-secret-value` and paste it into the GitHub App.
    Value: !Ref GitHubWebhookSecret

  WebhookSecretName:
    Description: Secret name, for convenience.
    Value: !Sub 'netra/${Stage}/github/webhook'

  GitHubAppSecretArn:
    Description: >-
      Secrets Manager secret holding the GitHub App ID and private key. Created
      empty; populate it with `aws secretsmanager put-secret-value`.
    Value: !Ref GitHubAppSecret

  GitHubAppSecretName:
    Description: GitHub App credentials secret name.
    Value: !Sub 'netra/${Stage}/github/app'

  DeliveriesTableName:
    Description: DynamoDB table holding delivery idempotency claims.
    Value: !Ref DeliveriesTable

  DeliveriesTableArn:
    Description: Needed when granting the webhook role write access.
    Value: !GetAtt DeliveriesTable.Arn

  EventBusName:
    Description: EventBridge bus carrying Netra.CodeChange events.
    Value: !Ref EventBus

  EventBusArn:
    Description: Needed when granting the webhook role events:PutEvents.
    Value: !GetAtt EventBus.Arn

  InvestigationStateMachineArn:
    Condition: DeployWorkflow
    Description: The investigation workflow.
    Value: !Ref InvestigationStateMachine

  InvestigationsTableName:
    Condition: DeployWorkflow
    Description: DynamoDB table holding investigations and their results.
    Value: !Ref InvestigationsTable

  ModelProviderSecretName:
    Condition: DeployWorkflow
    Description: Secret holding the OpenRouter keys; populate it out of band.
    Value: !Sub 'netra/${Stage}/model/openrouter'
