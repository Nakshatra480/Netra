AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Netra — GitHub webhook receiver.

  The minimal production entry point: an HTTPS endpoint that accepts GitHub
  deliveries, verifies their signature against a secret held in Secrets Manager,
  and acknowledges quickly. The investigation workflow is wired behind this in a
  later stack; nothing here depends on it.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment stage; used to name resources.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention. Kept short to bound cost.

  ExecutionRoleArn:
    Type: String
    Default: ''
    # Empty, or a role ARN. Empty means "create the role in this stack".
    AllowedPattern: '^$|^arn:(aws[a-zA-Z-]*)?:iam::\d{12}:role/[a-zA-Z_0-9+=,.@\-_/]+$'
    ConstraintDescription: Must be empty or a valid IAM role ARN.
    Description: >-
      Optional pre-created Lambda execution role. Supply this when the deploying
      principal cannot create IAM roles (an AWS PowerUserAccess profile cannot).
      Leave empty to let the stack create a least-privilege role itself.

Conditions:
  # Whether the deployer supplied a role, or the stack must create one.
  UseSuppliedRole: !Not [!Equals [!Ref ExecutionRoleArn, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]      # Graviton: cheaper per millisecond than x86.
    MemorySize: 256
    # GitHub gives a delivery 10 seconds. Failing well inside that means a slow
    # dependency surfaces as our error rather than as a GitHub timeout.
    Timeout: 8
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        NETRA_STAGE: !Ref Stage

Resources:
  # --------------------------------------------------------------------------
  # Secrets
  # --------------------------------------------------------------------------

  # The webhook secret is GENERATED by AWS rather than supplied. It therefore
  # never exists in source, in this template, or in a shell history: the value
  # is read from Secrets Manager and pasted into the GitHub App form once.
  GitHubWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'netra/${Stage}/github/webhook'
      Description: >-
        HMAC secret shared with the Netra GitHub App. Copy this value into the
        App's "Webhook secret" field.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: webhookSecret
        PasswordLength: 40
        # Keep it alphanumeric: GitHub's form and shell tooling both handle it
        # without escaping surprises.
        ExcludePunctuation: true

  # The GitHub App's identity: the App ID and its RSA private key, used to mint
  # short-lived installation tokens.
  #
  # Deliberately a SEPARATE secret from the webhook secret. The webhook receiver
  # needs only the HMAC secret, and giving it the private key as well would let
  # a flaw in a public, unauthenticated endpoint reach the credential that can
  # act on a customer's repositories.
  #
  # This resource carries NO value. CloudFormation owns the name, the ARN and
  # the IAM references; the private key is injected out of band with
  # `put-secret-value`, so it never enters this template, this repository, or a
  # CloudFormation change set.
  GitHubAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'netra/${Stage}/github/app'
      Description: >-
        Netra GitHub App credentials as JSON: {"appId","appSlug","privateKey"}.
        The value is set out of band and is never stored in source control.

  # --------------------------------------------------------------------------
  # Delivery idempotency and eventing
  # --------------------------------------------------------------------------

  # GitHub retries a delivery it considers failed, and a retry carries the same
  # X-GitHub-Delivery id. This table is how "we have already handled this one"
  # is decided: the first conditional write wins, so two concurrent invocations
  # cannot both proceed.
  DeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'netra-${Stage}-deliveries'
      BillingMode: PAY_PER_REQUEST     # Webhook traffic is bursty and sparse.
      AttributeDefinitions:
        - AttributeName: deliveryId
          AttributeType: S
      KeySchema:
        - AttributeName: deliveryId
          KeyType: HASH
      TimeToLiveSpecification:
        # Claims are only useful while GitHub might still retry; a week is far
        # beyond that, and TTL keeps the table from growing without bound.
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        # Idempotency claims are reconstructible and short-lived; paying to
        # back them up would buy nothing.
        PointInTimeRecoveryEnabled: false

  # Decouples "GitHub said something changed" from "Netra investigates it", so
  # the investigation can be slow, retried or replaced without GitHub waiting.
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'netra-${Stage}'

  # Until the investigation workflow exists, published events would vanish with
  # no trace. This archive keeps them, so the first workflow can be tested
  # against real deliveries rather than invented ones.
  EventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub 'netra-${Stage}-changes'
      SourceArn: !GetAtt EventBus.Arn
      Description: Code change events, retained so a new consumer can replay them.
      RetentionDays: 7
      EventPattern:
        source:
          - netra.github

  # --------------------------------------------------------------------------
  # Webhook receiver
  # --------------------------------------------------------------------------

  GitHubWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'netra-${Stage}-github-webhook'
      # Pre-bundled by `pnpm --filter @netra/webhook build`.
      CodeUri: ../services/webhook/dist
      Handler: githubWebhook.handler
      Description: Verifies and acknowledges GitHub webhook deliveries.
      Environment:
        Variables:
          GITHUB_WEBHOOK_SECRET_ARN: !Ref GitHubWebhookSecret
          NETRA_DELIVERIES_TABLE: !Ref DeliveriesTable
          NETRA_EVENT_BUS_NAME: !Ref EventBus
      # A supplied role is used as-is; its permissions are the deployer's to
      # manage. Otherwise the stack creates a role that can read exactly one
      # secret and nothing else.
      Role: !If [UseSuppliedRole, !Ref ExecutionRoleArn, !Ref 'AWS::NoValue']
      # Ignored by SAM when Role is supplied; applied to the generated role
      # otherwise. Least privilege either way: one secret, nothing else.
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubWebhookSecret
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /github/webhook
            Method: POST

  GitHubWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/netra-${Stage}-github-webhook'
      RetentionInDays: !Ref LogRetentionDays

  # --------------------------------------------------------------------------
  # API
  # --------------------------------------------------------------------------

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: Netra public webhook endpoint.
      # No CORS: this endpoint is called by GitHub's servers, never a browser.
      AccessLogSettings:
        DestinationArn: !GetAtt WebhookApiLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod","path":"$context.path",
          "status":"$context.status","latency":"$context.responseLatency",
          "integrationStatus":"$context.integrationStatus"}

  WebhookApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/netra-${Stage}-webhook'
      RetentionInDays: !Ref LogRetentionDays

  # --------------------------------------------------------------------------
  # Observability
  # --------------------------------------------------------------------------

  # A rejected signature is normal once; a sustained run of them means either a
  # misconfigured App or someone probing the endpoint.
  WebhookErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'netra-${Stage}-webhook-errors'
      AlarmDescription: The webhook receiver is failing to process deliveries.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GitHubWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  WebhookUrl:
    Description: Paste this into the GitHub App's "Webhook URL" field.
    Value: !Sub 'https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/github/webhook'
    Export:
      Name: !Sub 'netra-${Stage}-webhook-url'

  WebhookFunctionName:
    Description: Lambda function handling deliveries.
    Value: !Ref GitHubWebhookFunction

  WebhookSecretArn:
    Description: >-
      Secrets Manager secret holding the webhook secret. Read the value with
      `aws secretsmanager get-secret-value` and paste it into the GitHub App.
    Value: !Ref GitHubWebhookSecret

  WebhookSecretName:
    Description: Secret name, for convenience.
    Value: !Sub 'netra/${Stage}/github/webhook'

  GitHubAppSecretArn:
    Description: >-
      Secrets Manager secret holding the GitHub App ID and private key. Created
      empty; populate it with `aws secretsmanager put-secret-value`.
    Value: !Ref GitHubAppSecret

  GitHubAppSecretName:
    Description: GitHub App credentials secret name.
    Value: !Sub 'netra/${Stage}/github/app'

  DeliveriesTableName:
    Description: DynamoDB table holding delivery idempotency claims.
    Value: !Ref DeliveriesTable

  DeliveriesTableArn:
    Description: Needed when granting the webhook role write access.
    Value: !GetAtt DeliveriesTable.Arn

  EventBusName:
    Description: EventBridge bus carrying Netra.CodeChange events.
    Value: !Ref EventBus

  EventBusArn:
    Description: Needed when granting the webhook role events:PutEvents.
    Value: !GetAtt EventBus.Arn
