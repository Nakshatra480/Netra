[project]
name = "netra-investigator"
version = "0.1.0"
description = "Netra investigation engine: controlled repository analysis in an isolated sandbox."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "boto3>=1.35",
  "strands-agents>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
netra-investigate = "netra_investigator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ARG", "SIM"]
ignore = ["S603"]  # subprocess calls are argv-only and allowlisted by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
